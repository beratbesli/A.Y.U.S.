name: Windows application

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m PyInstaller --clean --noconfirm ayus.spec
      - name: Prepare package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\A.Y.U.S.exe package\A.Y.U.S.exe
          Copy-Item depremfoto.png package\depremfoto.png
          Copy-Item README.md package\README.md
          Compress-Archive -Path package\* -DestinationPath A.Y.U.S.-windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: A.Y.U.S.-windows
          path: A.Y.U.S.-windows.zip
