name: Windows application

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository to a safe Windows path
        shell: pwsh
        working-directory: ${{ runner.temp }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GITHUB_TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --no-tags "https://github.com/${{ github.repository }}.git" ayus
          Set-Location ayus
          git fetch --depth 1 origin $env:GITHUB_SHA
          git checkout --detach $env:GITHUB_SHA
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
        working-directory: ${{ runner.temp }}\ayus
      - run: python -m pip install -r requirements-build.txt
        working-directory: ${{ runner.temp }}\ayus
      - run: python -m PyInstaller --clean --noconfirm ayus.spec
        working-directory: ${{ runner.temp }}\ayus
      - name: Prepare package
        shell: pwsh
        working-directory: ${{ runner.temp }}
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item ayus\dist\A.Y.U.S.exe package\A.Y.U.S.exe
          Copy-Item ayus\depremfoto.png package\depremfoto.png
          Copy-Item ayus\README.md package\README.md
          Compress-Archive -Path package\* -DestinationPath A.Y.U.S.-windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: A.Y.U.S.-windows
          path: ${{ runner.temp }}\A.Y.U.S.-windows.zip
